name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.2
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: "pnpm"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.2
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: "pnpm"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.2
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: "pnpm"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Verify dist output
        run: |
          test -f packages/multi-account-core/dist/index.js
          test -f packages/anthropic-multi-account/dist/index.js
          test -f packages/codex-multi-account/dist/index.js

  build-node-matrix:
    name: build-node-matrix (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 20
            node-version: "20"
            scope: core
          - label: 22
            node-version: "22.22.2"
            scope: full
          - label: 24
            node-version: "24.15.0"
            scope: full
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build standalone core with pnpm
        if: matrix.scope == 'core'
        run: pnpm --filter opencode-multi-account-core build
      - name: Build full workspace with pnpm
        if: matrix.scope == 'full'
        run: pnpm run build
      - name: Verify standalone core loads on Node ${{ matrix.node-version }}
        if: matrix.scope == 'core'
        run: |
          node --input-type=module -e "
            import('./packages/multi-account-core/dist/index.js').then(m => console.log('core ok:', Object.keys(m).length, 'exports'));
          "
      - name: Verify full dist loads on Node ${{ matrix.node-version }}
        if: matrix.scope == 'full'
        run: |
          node --input-type=module -e "
            import('./packages/multi-account-core/dist/index.js').then(m => console.log('core ok:', Object.keys(m).length, 'exports'));
            import('./packages/anthropic-multi-account/dist/index.js').then(m => console.log('anthropic ok:', Object.keys(m).length, 'exports'));
            import('./packages/codex-multi-account/dist/index.js').then(m => console.log('codex ok:', Object.keys(m).length, 'exports'));
          "
